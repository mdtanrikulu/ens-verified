[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

# CI runs with FOUNDRY_PROFILE=ci (.github/workflows/test.yml); inherits the defaults.
[profile.ci]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
